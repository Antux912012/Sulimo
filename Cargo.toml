[workspace]
resolver = "2"
members = [
    "crates/sulimo-core",
    "crates/sulimo-cpu",
    "crates/sulimo-ocl",
    "crates/sulimo-engine",
    "crates/sulimo-cli",
    "crates/sulimo-gtk",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Antonio <antux912012@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/antux912012/Sulimo"

[workspace.dependencies]
thiserror = "2.0.11"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
opencl3 = { version = "0.12.3", default-features = true }
libc = "0.2.169"
memmap2 = "0.9.11"
half = { version = "2.7.1", default-features = false, features = ["std"] }
sha2 = "0.10.8"
ureq = { version = "2.10.1", default-features = false, features = ["tls"] }
