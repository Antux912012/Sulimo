<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: GNOME Libadwaita Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>
    
    <!-- Papirus-style Crisp Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bgGrad)" />
  
  <!-- Subtle Top Highlight Border (Libadwaita Depth) -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Dynamic Wind / Flow Symbol -->
  <g filter="url(#dropShadow)">
    <path d="M 36 44 C 50 44, 75 44, 88 44 C 98 44, 102 36, 96 30 C 90 24, 78 28, 76 38 C 74 48, 86 64, 92 72" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.95" />
    <path d="M 32 64 C 45 64, 68 64, 78 64 C 86 64, 92 70, 88 78 C 84 84, 72 82, 70 74 C 68 66, 78 54, 84 48" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.65" />
    <path d="M 36 84 C 48 84, 64 84, 72 84 C 80 84, 84 90, 80 96 C 76 102, 64 100, 62 92" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.35" />
  </g>
</svg>
